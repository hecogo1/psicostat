name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[app,dev]"
      - run: ruff check src tests
      - run: pytest -q
      - name: End-to-end example
        run: |
          psicostat example mixed --out demo
          psicostat analyze demo/diseno.json demo/datos.csv --out demo/resultados
