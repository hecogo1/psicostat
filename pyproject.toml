[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "psicostat"
version = "0.3.0"
description = "Asistente open source de metodología y análisis estadístico (APA 7) para psicología / Open-source methods & statistics assistant for psychology"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Héctor Cózar"}]
requires-python = ">=3.9"
dependencies = ["numpy>=1.23", "pandas>=1.5", "scipy>=1.11", "statsmodels>=0.14", "matplotlib>=3.6", "python-docx>=1.0"]
keywords = ["psychology", "statistics", "APA", "power analysis", "sample size", "psicologia", "estadistica"]
classifiers = ["License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3", "Intended Audience :: Science/Research", "Topic :: Scientific/Engineering :: Mathematics"]

[project.optional-dependencies]
app = ["streamlit>=1.30"]
dev = ["pytest>=7", "ruff>=0.4"]

[project.scripts]
psicostat = "psicostat.cli:main"

[tool.setuptools.package-data]
psicostat = ["assets/*.svg"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 190

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E731"]

[tool.ruff.lint.per-file-ignores]
"src/psicostat/app.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
